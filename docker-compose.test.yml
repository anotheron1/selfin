# Тестовый стенд (ANO-50). Отдельный docker-проект, свой том, свои порты.
#
#   COMPOSE_PROJECT_NAME=selfin-test docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
#
# Фронт: http://localhost:5174   API: http://localhost:8081   БД: localhost:5433
# Боевой стенд (5173/8080/5432) не затрагивается.
#
# !override обязателен: без него compose СКЛЕИВАЕТ списки портов с базовым файлом,
# и контейнер пытается занять и 8080, и 8081 одновременно.
services:
  db:
    container_name: selfin-test-db
    ports: !override
      - "5433:5432"

  backend:
    container_name: selfin-test-backend
    ports: !override
      - "8081:8080"

  frontend:
    container_name: selfin-test-frontend
    ports: !override
      - "5174:80"
