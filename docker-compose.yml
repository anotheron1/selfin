services:
  db:
    image: postgres:15-alpine
    container_name: selfin-db
    environment:
      POSTGRES_DB: selfin
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: selfin-backend
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/selfin
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      # Ревью #45: «сегодня» на сервере обязано совпадать с «сегодня» в браузере.
      # Контейнер без этой строки живёт в GMT (проверено на образе: zone=GMT), а
      # ANO-155 запретил факт позже сегодняшнего дня — в Москве с полуночи до трёх
      # ночи сервер отвечал бы 400 на запись сегодняшней траты, и человек не увидел
      # бы даже причины (показ ошибки — ANO-141). Зона переопределяется переменной
      # окружения TZ; часовой пояс как настройка пользователя — задача ANO-135.
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: selfin-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
