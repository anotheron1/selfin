spring.application.name=backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/selfin
spring.datasource.username=admin
spring.datasource.password=admin

# JPA: только проверяет схему — Flyway управляет DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate: если схема уже существует (без flyway_schema_history),
# зафиксировать её как версию 2 и применить только более новые миграции
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Jackson: serialise dates/YearMonth as ISO strings, not numeric arrays
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Вход (ANO-195), вариант Б: браузер входит через наш сервер, скрипты ходят по Bearer.
# Спека: docs/superpowers/specs/2026-10-13-server-knows-owner-design.md
#
# У Keycloak два адреса: url — для браузера, от него же издатель токенов; internal-url — для сервера.
# В docker они разные: 127.0.0.1 внутри контейнера — сам контейнер. Без docker совпадают.
# Discovery нет — адреса заданы явно, и сервер стартует без поднятого Keycloak.
selfin.keycloak.url=http://127.0.0.1:8180
selfin.keycloak.internal-url=${selfin.keycloak.url}
# sub Keycloak того, кому достаются нынешние данные: при первом его входе он получает синтетического
# владельца из V31 — если тот ещё ни с кем не связан. Пусто — никому.
selfin.owner-sub=

# Браузер: конфиденциальный клиент selfin, код с PKCE. Секрет — тот же, что у клиента в реалме;
# значение по умолчанию — для разработки и стенда, на сервере — свой (ANO-197).
spring.security.oauth2.client.registration.keycloak.client-id=selfin
spring.security.oauth2.client.registration.keycloak.client-secret=${SELFIN_CLIENT_SECRET:selfin-dev-secret}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid
# Адрес возврата — от адреса экрана: вход идёт через прокси экрана, cookie сеанса остаётся у него.
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.authorization-uri=${selfin.keycloak.url}/realms/selfin/protocol/openid-connect/auth
spring.security.oauth2.client.provider.keycloak.token-uri=${selfin.keycloak.internal-url}/realms/selfin/protocol/openid-connect/token
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${selfin.keycloak.internal-url}/realms/selfin/protocol/openid-connect/certs
spring.security.oauth2.client.provider.keycloak.user-name-attribute=sub
server.servlet.session.cookie.same-site=lax

# Скрипты и CI: Bearer — подпись по ключам реалма, срок, издатель, аудитория selfin.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${selfin.keycloak.url}/realms/selfin
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${selfin.keycloak.internal-url}/realms/selfin/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=selfin
