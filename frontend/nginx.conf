# Схема запроса для бэка (ANO-197): за HTTPS-прокси на сервере — та, что проставил он, без прокси (стенд) — своя.
# Без неё Spring строит адрес возврата из Keycloak http://, а cookie сеанса выходит без Secure.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# Публичный порт — из Host, каким его набрал браузер: дверь у друга порт не передаёт, а Tomcat, получив схему без
# порта, ставит порт схемы — 443 или 80. Без него терялись и 8443 у сервера на своём порту, и 5174 стенда.
# Нет порта в Host — пусто, заголовок не уходит, и порт схемы верен.
map $http_host $forwarded_port {
    ~:(?<port>\d+)$ $port;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Имя бэка — на каждый запрос, через DNS Docker: без бэка nginx стартует, а бэк, поднявшийся позже, находит сам.
    # Находка 15.10: с адресом прямо в proxy_pass nginx искал имя один раз при старте и падал, если бэка ещё не было.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Предел тела и тайм-ауты — явно и те же, что у двери у друга (ANO-242): в цепочке прокси действует самый
    # маленький предел и самый короткий тайм-аут, и пусть это будет решение, а не умолчание.
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Keycloak снаружи — только вход, выход и возврат из Telegram (ANO-242, было в Caddyfile шага 3). Консоль
    # администратора — с самого сервера (127.0.0.1:8180), консоль учётной записи закрыта: через неё учётная запись
    # заводится мимо согласия. ^~ — чтобы регулярка, добавленная потом, закрытое не перехватила.
    location ^~ /auth/admin { return 404; }
    location ^~ /auth/realms/master { return 404; }
    location ^~ /auth/realms/selfin/account { return 404; }
    # Корень Keycloak наружу не выставлять — совет самого Keycloak.
    location = /auth/ { return 404; }

    # Keycloak живёт под /auth и получает адрес как есть (proxy_pass без пути); имя — на каждый запрос, как у бэка.
    location /auth/ {
        set $keycloak http://keycloak:8080;
        proxy_pass $keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    # На бэкенд (имя сервиса в docker-compose): API, а с ANO-195 — вход, возврат из Keycloak и выход.
    # Тем же адресом, что и экран: cookie сеанса и CSRF живут у адреса экрана.
    # Host — с портом ($http_host): от него Spring строит адрес возврата из Keycloak, а $host порт теряет.
    location ~ ^/(api/|oauth2/|login/oauth2/|logout$) {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Port $forwarded_port;
    }

    # SPA: все остальные пути отдаём index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html — без хранения (ANO-222): браузер каждый раз сверяет ETag и после выкладки грузит новый бандл.
    # Пути SPA приходят сюда внутренним переходом из try_files — заголовок получают и они.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Бандлы с хэшем в имени — навсегда: новое содержимое — новое имя. Чего нет — 404, а не страница:
    # иначе старая вкладка, запросив удалённый бандл, получила бы HTML вместо скрипта.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
